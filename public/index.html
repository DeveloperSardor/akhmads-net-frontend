<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Core System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(45deg,#050510,#0b0020,#000);
    background-size:400% 400%;
    animation:bgMove 15s ease infinite;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* PARTICLES */
body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background: radial-gradient(white 1px, transparent 1px);
    background-size: 35px 35px;
    opacity:0.04;
    animation: moveParticles 60s linear infinite;
}

@keyframes moveParticles{
    from{ transform: translate(0,0); }
    to{ transform: translate(-300px,-300px); }
}

/* CORE */
.core{
    position:relative;
    width:400px;
    height:400px;
    border-radius:50%;
    backdrop-filter: blur(10px);
    background: radial-gradient(circle at center,#0f0f2a 40%,#070715 100%);
    box-shadow:
        0 0 60px rgba(120,0,255,0.3),
        inset 0 0 120px rgba(100,0,255,0.4);
    transition:0.3s;
}

.core:hover{
    transform: scale(1.05);
}

/* ROTATING RINGS */
.ring{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    border:2px solid transparent;
    border-top:2px solid #8f2fff;
    border-bottom:2px solid #4b00ff;
    animation: rotate 6s linear infinite;
}

.ring:nth-child(2){
    width:85%;
    height:85%;
    top:7.5%;
    left:7.5%;
    animation-direction: reverse;
}

@keyframes rotate{
    from{ transform:rotate(0deg);}
    to{ transform:rotate(360deg);}
}

/* X MARK */
.x-mark{
    position:absolute;
    width:170px;
    height:170px;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.x-mark span{
    position:absolute;
    width:100%;
    height:12px;
    background: linear-gradient(90deg,#6a00ff,#b84dff);
    border-radius:20px;
    top:50%;
    transform-origin:center;
    box-shadow:0 0 25px #a64dff;
    transition:0.3s;
}

.x-mark span:first-child{ transform: rotate(45deg); }
.x-mark span:last-child{ transform: rotate(-45deg); }

.core:hover .x-mark span{
    box-shadow:0 0 40px #ff00ff;
}

/* HUD TEXT */
.hud{
    position:absolute;
    bottom:-70px;
    width:100%;
    text-align:center;
    color:#9a6cff;
    letter-spacing:3px;
    font-size:14px;
    opacity:0;
    animation:fadeIn 3s forwards 2s;
}

@keyframes fadeIn{
    to{opacity:1;}
}

/* CLICK BURST */
.burst{
    position:absolute;
    width:10px;
    height:10px;
    background:#b84dff;
    border-radius:50%;
    pointer-events:none;
    animation: explode 0.6s forwards;
}

@keyframes explode{
    to{
        transform: scale(15);
        opacity:0;
    }
}

</style>
</head>
<body>

<div class="core" onclick="burstEffect(event)">
    <div class="ring"></div>
    <div class="ring"></div>

    <div class="x-mark">
        <span></span>
        <span></span>
    </div>

    <div class="hud">
      AKHMADS ◆ Digital Advertising Network
        </div>
</div>

<script>
function burstEffect(e){
    const core = document.querySelector('.core');
    const burst = document.createElement('div');
    burst.classList.add('burst');
    burst.style.left = e.offsetX + 'px';
    burst.style.top = e.offsetY + 'px';
    core.appendChild(burst);

    setTimeout(()=>burst.remove(),600);
}
</script>

</body>
</html>
